<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>陶器 toki — storm rankings</title>
<style>
:root {
  --ink:        #e8e9f3;
  --ink-dim:    #9ea0bd;
  --ink-faint:  #5f6286;
  --calm:       #9b7cff;
  --calm-soft:  rgba(155, 124, 255, 0.18);
  --pass:       #6dffb0;
  --pass-soft:  rgba(109, 255, 176, 0.20);
  --warn:       #ffb766;
  --warn-soft:  rgba(255, 183, 102, 0.20);
  --fail:       #ff5d6c;
  --fail-soft:  rgba(255, 93, 108, 0.22);
  --bolt:       #ffe66c;
  --bolt-glow:  rgba(255, 230, 108, 0.55);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Display",
               "Inter", system-ui, sans-serif;
  font-feature-settings: "ss01", "cv11";
  background: #050614;
  color: var(--ink);
  overflow-x: hidden;
  position: relative;
  letter-spacing: -0.01em;
  min-height: 100vh;
}

/* STORM (same shared visual language as index.html) */
.storm,
.storm::before,
.storm::after {
  position: fixed; inset: -20%;
  pointer-events: none; z-index: 0;
}
.storm {
  background:
    radial-gradient(ellipse at 20% 30%, #1a1238 0%, transparent 55%),
    radial-gradient(ellipse at 80% 40%, #1d2148 0%, transparent 60%),
    radial-gradient(ellipse at 50% 80%, #2a1438 0%, transparent 55%),
    linear-gradient(180deg, #050614 0%, #07071e 60%, #0a0418 100%);
}
.storm::before {
  content: "";
  background:
    radial-gradient(ellipse 60% 35% at 30% 20%, rgba(78, 60, 140, 0.45), transparent 70%),
    radial-gradient(ellipse 50% 30% at 70% 60%, rgba(40, 80, 140, 0.35), transparent 70%),
    radial-gradient(ellipse 70% 40% at 50% 90%, rgba(110, 50, 130, 0.3), transparent 70%);
  animation: storm-churn 38s ease-in-out infinite alternate;
  mix-blend-mode: screen;
}
.storm::after {
  content: "";
  background:
    radial-gradient(ellipse 40% 25% at 80% 15%, rgba(60, 50, 130, 0.40), transparent 70%),
    radial-gradient(ellipse 45% 30% at 15% 65%, rgba(90, 40, 110, 0.40), transparent 70%);
  animation: storm-churn-2 47s ease-in-out infinite alternate;
  mix-blend-mode: screen;
}
@keyframes storm-churn {
  0%   { transform: translate3d(-2%, -1%, 0) scale(1.02); opacity: 0.85; }
  50%  { transform: translate3d( 3%,  2%, 0) scale(1.06); opacity: 1.00; }
  100% { transform: translate3d(-1%,  3%, 0) scale(1.03); opacity: 0.90; }
}
@keyframes storm-churn-2 {
  0%   { transform: translate3d( 2%,  1%, 0) scale(1.05); }
  50%  { transform: translate3d(-3%, -2%, 0) scale(1.10); }
  100% { transform: translate3d( 1%, -3%, 0) scale(1.04); }
}
.lightning {
  position: fixed; inset: 0; pointer-events: none; z-index: 1;
  animation: lightning-pulse 18s linear infinite;
}
@keyframes lightning-pulse {
  0%, 22%, 23%, 100%   { background: rgba(255, 255, 255, 0); }
  22.4%                 { background: rgba(220, 230, 255, 0.18); }
  22.6%                 { background: rgba(255, 255, 255, 0.05); }
  22.8%                 { background: rgba(255, 255, 255, 0.32); }
  23.2%                 { background: rgba(255, 255, 255, 0.04); }
  68%, 68.4%            { background: rgba(255, 255, 255, 0); }
  68.2%                 { background: rgba(220, 230, 255, 0.20); }
}
.rain {
  position: fixed; inset: 0; pointer-events: none; z-index: 1;
  background-image:
    linear-gradient(180deg, transparent 0%, rgba(120, 110, 200, 0.06) 50%, transparent 100%);
  background-size: 1px 28px;
  animation: rain-fall 1.1s linear infinite;
  opacity: 0.4;
}
@keyframes rain-fall { to { background-position: 0 28px; } }

/* LAYOUT */
.shell {
  position: relative; z-index: 5;
  display: grid;
  grid-template-rows: auto auto 1fr auto;
  min-height: 100vh;
  padding: 28px 40px;
  gap: 24px;
}
.topbar {
  display: flex; justify-content: space-between; align-items: center;
}
.brand {
  display: flex; gap: 14px; align-items: baseline;
  font-weight: 600; letter-spacing: 0.02em;
}
.brand .glyph {
  font-size: 22px; color: var(--calm);
  text-shadow: 0 0 18px var(--calm-soft);
}
.brand .name { font-size: 18px; }
.brand .tag {
  font-size: 12px; color: var(--ink-faint); font-weight: 400;
  letter-spacing: 0.18em; text-transform: uppercase;
}
.nav { display: flex; gap: 22px; }
.nav a {
  color: var(--ink-dim); text-decoration: none; font-size: 13px;
  letter-spacing: 0.04em; padding: 4px 0;
  border-bottom: 1px solid transparent;
  transition: color 0.2s, border-color 0.2s;
}
.nav a:hover, .nav a.active { color: var(--ink); border-color: var(--calm); }

/* SUITE TABS — three weather symbols */
.suites {
  display: flex; gap: 16px; justify-content: center;
  margin-top: 8px;
}
.suite-tab {
  background: rgba(8, 6, 30, 0.6);
  border: 1px solid rgba(155, 124, 255, 0.18);
  border-radius: 12px;
  padding: 12px 18px;
  display: flex; gap: 12px; align-items: center;
  cursor: pointer;
  font-family: inherit;
  color: var(--ink-dim);
  font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase;
  transition: all 0.2s ease;
  backdrop-filter: blur(8px);
}
.suite-tab:hover {
  border-color: rgba(155, 124, 255, 0.5);
  color: var(--ink);
}
.suite-tab.active {
  background: linear-gradient(140deg, rgba(155, 124, 255, 0.2), rgba(110, 80, 200, 0.05));
  border-color: var(--calm);
  color: var(--ink);
  box-shadow: 0 0 32px var(--calm-soft);
}
.suite-tab .symbol {
  font-size: 24px;
  filter: drop-shadow(0 0 6px var(--calm-soft));
}
.suite-tab .symbol.thunder { color: var(--bolt); filter: drop-shadow(0 0 6px var(--bolt-glow)); }
.suite-tab .symbol.wind    { color: #b8d4ff; }
.suite-tab .symbol.rain    { color: #80aaff; }

/* THE STORM ARENA — vertical column of floating shapes */
.arena {
  position: relative;
  display: grid;
  grid-template-columns: minmax(260px, 320px) 1fr;
  gap: 32px;
  min-height: 600px;
  align-items: stretch;
}

.column {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  padding: 16px 0;
}

/* Vertical rank scale on the left edge */
.rank-scale {
  position: relative;
  display: flex; flex-direction: column; justify-content: space-between;
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--ink-faint);
  padding: 16px 0;
}
.rank-scale .rank-tick {
  display: flex; align-items: center; gap: 12px;
}
.rank-scale .rank-tick::before {
  content: ""; width: 32px; height: 1px;
  background: linear-gradient(90deg, transparent, var(--ink-faint));
}

/* Each model "shape" floats in the storm */
.model-row {
  position: relative;
  width: 100%;
  display: grid;
  grid-template-columns: 80px 100px 1fr auto;
  align-items: center;
  gap: 18px;
  padding: 12px 18px;
  background: rgba(8, 6, 30, 0.45);
  border: 1px solid rgba(155, 124, 255, 0.10);
  border-radius: 14px;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  animation: float-drift 12s ease-in-out infinite alternate;
  transition: border-color 0.3s, box-shadow 0.3s;
}
.model-row:hover {
  border-color: rgba(155, 124, 255, 0.4);
  box-shadow: 0 0 32px var(--calm-soft);
}

/* Per-model float offset so they don't all sync */
.model-row:nth-child(1) { animation-delay: 0s;     animation-duration: 9s; }
.model-row:nth-child(2) { animation-delay: -2.1s;  animation-duration: 11s; }
.model-row:nth-child(3) { animation-delay: -4.3s;  animation-duration: 13s; }
.model-row:nth-child(4) { animation-delay: -6.7s;  animation-duration: 10s; }
.model-row:nth-child(5) { animation-delay: -3.2s;  animation-duration: 12s; }
.model-row:nth-child(6) { animation-delay: -5.4s;  animation-duration: 14s; }
@keyframes float-drift {
  0%   { transform: translateY(-3px); }
  100% { transform: translateY( 3px); }
}

/* Rank label */
.rank-num {
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  font-size: 32px;
  font-weight: 600;
  color: var(--ink-faint);
  text-align: center;
  letter-spacing: -0.02em;
}
.rank-num.first  { color: var(--pass); text-shadow: 0 0 18px var(--pass-soft); }
.rank-num.second { color: var(--calm); text-shadow: 0 0 12px var(--calm-soft); }
.rank-num.last   { color: var(--fail); text-shadow: 0 0 12px var(--fail-soft); }

/* Geometric model shape — varies by rank */
.shape-cell {
  width: 80px; height: 80px;
  display: grid; place-items: center;
  position: relative;
}
.shape {
  width: 64px; height: 64px;
  position: relative;
  filter: drop-shadow(0 0 16px var(--calm-soft));
  animation: shape-pulse 6s ease-in-out infinite;
}
@keyframes shape-pulse {
  0%, 100% { transform: scale(1.0)   rotate(0deg); }
  50%      { transform: scale(1.04)  rotate(2deg); }
}

/* Aura ring on top-tier shapes */
.shape-cell.tier-top::before,
.shape-cell.tier-top::after {
  content: "";
  position: absolute;
  width: 92px; height: 92px;
  border-radius: 50%;
  border: 1px solid var(--pass-soft);
  pointer-events: none;
  animation: aura-breathe 3s ease-in-out infinite;
}
.shape-cell.tier-top::after {
  width: 110px; height: 110px;
  animation-duration: 4.5s;
  animation-delay: -1.5s;
}
@keyframes aura-breathe {
  0%, 100% { transform: scale(0.94); opacity: 0.5; }
  50%      { transform: scale(1.06); opacity: 0.85; }
}

/* The shapes themselves: sphere → calm; hex → mid; cracked polygon → low */
.shape.sphere {
  background: radial-gradient(circle at 30% 30%, #b8ffd6 0%, #6dffb0 50%, #1f4d3a 100%);
  border-radius: 50%;
}
.shape.hex {
  background: linear-gradient(140deg, #6c4dff 0%, #b08bff 60%, #e1d4ff 100%);
  clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
}
.shape.diamond {
  background: linear-gradient(140deg, #ffd591 0%, #ffb766 50%, #b87a30 100%);
  clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
  filter: drop-shadow(0 0 16px var(--warn-soft));
}
.shape.jagged {
  background: linear-gradient(140deg, #5a1825 0%, #ff5d6c 50%, #2a0a10 100%);
  clip-path: polygon(50% 0%, 78% 18%, 100% 30%, 92% 60%, 100% 80%, 65% 92%, 50% 100%, 25% 88%, 4% 78%, 12% 50%, 0% 28%, 22% 14%);
  filter: drop-shadow(0 0 16px var(--fail-soft));
  animation: jagged-distress 4s ease-in-out infinite;
}
@keyframes jagged-distress {
  0%, 100% { transform: scale(1.0) rotate(0deg); }
  50%      { transform: scale(0.96) rotate(-3deg); }
}
.shape.jagged::after {
  /* visible cracks */
  content: "";
  position: absolute; inset: 0;
  background:
    linear-gradient(105deg, transparent 38%, #ffe3e8 39%, #ffe3e8 40%, transparent 41%) no-repeat,
    linear-gradient(160deg, transparent 60%, #ffe3e8 61%, #ffe3e8 62%, transparent 63%) no-repeat,
    linear-gradient(45deg,  transparent 55%, #ffe3e8 56%, #ffe3e8 57%, transparent 58%) no-repeat;
  clip-path: inherit;
  filter: drop-shadow(0 0 6px var(--fail));
  opacity: 0.85;
}

/* Model identity */
.identity {
  display: flex; flex-direction: column; gap: 4px;
}
.identity .id-name {
  font-size: 17px; font-weight: 600;
  letter-spacing: -0.005em;
}
.identity .id-meta {
  font-size: 11px; color: var(--ink-faint);
  letter-spacing: 0.08em; text-transform: uppercase;
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
}
.identity .sig-badge {
  display: inline-block;
  padding: 1px 8px;
  border-radius: 999px;
  background: var(--pass-soft);
  color: var(--pass);
  font-size: 9px; letter-spacing: 0.16em; margin-top: 4px;
  font-weight: 600;
}
.identity .sig-badge.no-wins { background: var(--fail-soft); color: var(--fail); }

/* Score block on the right */
.score {
  display: flex; flex-direction: column; align-items: flex-end;
  gap: 4px;
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
}
.score .score-num {
  font-size: 28px; font-weight: 600;
  color: var(--ink);
  letter-spacing: -0.02em;
  font-feature-settings: "tnum";
}
.score .score-num.tier-top    { color: var(--pass);  }
.score .score-num.tier-mid    { color: var(--calm); }
.score .score-num.tier-warn   { color: var(--warn);  }
.score .score-num.tier-bottom { color: var(--fail);  }
.score .wlt {
  font-size: 11px;
  color: var(--ink-faint);
  letter-spacing: 0.14em;
}
.score .wlt .w { color: var(--pass); }
.score .wlt .l { color: var(--fail); }
.score .wlt .t { color: var(--ink-dim); }

/* META FOOTER — alpha + n_pairs */
.meta-bar {
  display: flex; justify-content: space-between; align-items: center;
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  font-size: 11px; letter-spacing: 0.1em;
  color: var(--ink-faint);
  padding: 8px 16px;
  border: 1px solid rgba(155, 124, 255, 0.10);
  border-radius: 10px;
  background: rgba(8, 6, 30, 0.50);
  backdrop-filter: blur(6px);
}
.meta-bar .label { color: var(--ink-faint); margin-right: 6px; }
.meta-bar .num   { color: var(--ink); }

/* PAIRWISE MATRIX */
.matrix-section {
  margin-top: 16px;
}
.matrix-section h3 {
  font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--ink-faint); margin-bottom: 12px; font-weight: 500;
}
.matrix {
  display: grid;
  gap: 4px;
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  font-size: 10px;
}
.matrix-row { display: grid; gap: 4px; align-items: center; }
.matrix-cell {
  height: 30px;
  display: grid; place-items: center;
  border-radius: 6px;
  font-size: 10px; letter-spacing: 0.04em;
  background: rgba(8, 6, 30, 0.40);
  border: 1px solid rgba(155, 124, 255, 0.06);
  color: var(--ink-dim);
}
.matrix-cell.diag {
  background: rgba(155, 124, 255, 0.05);
  color: var(--ink-faint);
}
.matrix-cell.win  {
  background: var(--pass-soft);
  color: var(--pass);
  border-color: var(--pass);
}
.matrix-cell.loss {
  background: var(--fail-soft);
  color: var(--fail);
  border-color: var(--fail);
}
.matrix-cell.tie  {
  background: rgba(155, 124, 255, 0.10);
  color: var(--ink-dim);
}
.matrix-cell.label {
  background: transparent;
  border: none;
  color: var(--ink-faint);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  font-size: 9px;
  justify-content: flex-start;
  padding-left: 6px;
}

/* STATUS LINE */
.status {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 4px;
  font-size: 11px; letter-spacing: 0.1em;
  color: var(--ink-faint);
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
}
.status .pulse {
  display: inline-block; width: 6px; height: 6px;
  border-radius: 50%; background: var(--calm); margin-right: 8px;
  box-shadow: 0 0 8px var(--calm);
  animation: pulse 2s ease-in-out infinite;
}
.status .pulse.alive { background: var(--pass); box-shadow: 0 0 8px var(--pass); }
.status .pulse.dead  { background: var(--fail); box-shadow: 0 0 8px var(--fail); }
@keyframes pulse {
  0%, 100% { opacity: 0.6; transform: scale(1); }
  50%      { opacity: 1.0; transform: scale(1.3); }
}

/* LOADING STATE */
.loading-shell {
  display: grid; place-items: center;
  padding: 80px 0;
  color: var(--ink-faint);
  font-size: 12px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
}
.loading-shell .spinner {
  width: 28px; height: 28px;
  border: 2px solid var(--calm-soft);
  border-top-color: var(--calm);
  border-radius: 50%;
  animation: spin 1.2s linear infinite;
  margin-bottom: 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 900px) {
  .arena { grid-template-columns: 1fr; }
  .matrix-section { display: none; }
}
@media (max-width: 600px) {
  .shell { padding: 16px 20px; }
  .model-row { grid-template-columns: 60px 60px 1fr auto; gap: 10px; padding: 10px 12px; }
  .shape-cell { width: 60px; height: 60px; }
  .shape { width: 48px; height: 48px; }
  .nav { display: none; }
}
</style>
</head>
<body>

<div class="storm" aria-hidden="true"></div>
<div class="lightning" aria-hidden="true"></div>
<div class="rain" aria-hidden="true"></div>

<div class="shell">

  <header class="topbar">
    <div class="brand">
      <span class="glyph">陶器</span>
      <span class="name">toki</span>
      <span class="tag">storm rankings</span>
    </div>
    <nav class="nav">
      <a href="/">Storm</a>
      <a href="/leaderboard.html" class="active">Rankings</a>
      <a href="/api/health" target="_blank">API</a>
    </nav>
  </header>

  <div class="suites" role="tablist" aria-label="Test suite">
    <button type="button" class="suite-tab active" data-suite="adversarial" role="tab">
      <span class="symbol thunder">⛈</span>
      <span>Adversarial</span>
    </button>
    <button type="button" class="suite-tab" data-suite="paraphrase" role="tab">
      <span class="symbol wind">🌬</span>
      <span>Paraphrase</span>
    </button>
    <button type="button" class="suite-tab" data-suite="noise" role="tab">
      <span class="symbol rain">🌧</span>
      <span>Noise</span>
    </button>
  </div>

  <main>
    <div class="arena">
      <aside class="rank-scale" id="rankScale">
        <span class="rank-tick">eye of calm</span>
        <span class="rank-tick">in the wind</span>
        <span class="rank-tick">battered</span>
        <span class="rank-tick">shattered</span>
      </aside>

      <section class="column" id="modelColumn">
        <div class="loading-shell">
          <div class="spinner"></div>
          <span>Generating storm…</span>
        </div>
      </section>
    </div>

    <section class="meta-bar" id="metaBar" hidden>
      <span><span class="label">Suite</span><span class="num" id="metaSuite">—</span></span>
      <span><span class="label">Models</span><span class="num" id="metaModels">—</span></span>
      <span><span class="label">Pairs</span><span class="num" id="metaPairs">—</span></span>
      <span><span class="label">α<sub>bonf</sub></span><span class="num" id="metaAlpha">—</span></span>
      <span><span class="label">Run time</span><span class="num" id="metaTiming">—</span></span>
    </section>

    <section class="matrix-section" id="matrixSection" hidden>
      <h3>Pairwise outcomes — paired t-test + Wilcoxon at α<sub>bonf</sub></h3>
      <div class="matrix" id="matrix"></div>
    </section>
  </main>

  <footer class="status">
    <span><span class="pulse" id="livePulse"></span><span id="liveText">connecting…</span></span>
    <span id="versionText">toki · adversarial robustness lab</span>
  </footer>
</div>

<script>
const API_BASE = window.location.origin.startsWith("http")
  ? window.location.origin
  : "http://127.0.0.1:8765";

async function api(method, path, body) {
  const r = await fetch(API_BASE + path, {
    method,
    headers: { "Content-Type": "application/json" },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!r.ok) throw new Error(`${method} ${path} → ${r.status}`);
  return r.json();
}

// ───────────── boot
(async () => {
  try {
    const h = await api("GET", "/api/health");
    document.getElementById("livePulse").classList.add("alive");
    document.getElementById("liveText").textContent =
      `connected · evaluator online · v${h.version}`;
    document.getElementById("versionText").textContent =
      `toki v${h.version} · adversarial robustness lab`;
  } catch (e) {
    document.getElementById("livePulse").classList.add("dead");
    document.getElementById("liveText").textContent = "demo server unreachable";
  }
})();

// ───────────── render

/** Map mean_score → which geometric shape archetype to render. */
function shapeFor(score) {
  if (score >= 0.85) return { cls: "sphere",  tier: "tier-top",    label: "calm" };
  if (score >= 0.65) return { cls: "hex",     tier: "tier-mid",    label: "in the wind" };
  if (score >= 0.40) return { cls: "diamond", tier: "tier-warn",   label: "battered" };
  return                    { cls: "jagged",  tier: "tier-bottom", label: "shattered" };
}

function rankLabel(r, n) {
  if (r === 1) return "first";
  if (r === 2) return "second";
  if (r === n) return "last";
  return "";
}

function renderEntries(entries) {
  const col = document.getElementById("modelColumn");
  col.innerHTML = "";
  const n = entries.length;

  for (const e of entries) {
    const s = shapeFor(e.mean_score);
    const auraCls = s.tier === "tier-top" ? "tier-top" : "";
    const rkCls = rankLabel(e.rank, n);

    const row = document.createElement("div");
    row.className = "model-row";
    row.innerHTML = `
      <div class="rank-num ${rkCls}">#${e.rank}</div>
      <div class="shape-cell ${auraCls}">
        <div class="shape ${s.cls}"></div>
      </div>
      <div class="identity">
        <div class="id-name">${e.name}</div>
        <div class="id-meta">${s.label} · ${e.n_comparisons} pairs</div>
        ${e.wins > 0
          ? `<div class="sig-badge${e.significant ? "" : " no-wins"}">${e.significant ? "stat. sig." : "wins not sig."}</div>`
          : ""}
      </div>
      <div class="score">
        <div class="score-num ${s.tier}">${e.mean_score.toFixed(3)}</div>
        <div class="wlt">
          <span class="w">${e.wins}W</span> ·
          <span class="l">${e.losses}L</span> ·
          <span class="t">${e.ties}T</span>
        </div>
      </div>
    `;
    col.appendChild(row);
  }
}

function renderMatrix(entries, pairs) {
  const matrix = document.getElementById("matrix");
  const section = document.getElementById("matrixSection");
  section.hidden = false;

  const names = entries.map(e => e.name);
  const idx = Object.fromEntries(names.map((n, i) => [n, i]));
  const k = names.length;

  // Build outcome lookup keyed by ordered pair
  const lookup = {};
  for (const p of pairs) {
    lookup[p.name_a + "|" + p.name_b] = p;
  }

  // Header row + body
  matrix.innerHTML = "";
  matrix.style.gridTemplateColumns = `120px repeat(${k}, 1fr)`;

  // Header
  const header = document.createElement("div");
  header.className = "matrix-row";
  header.style.gridTemplateColumns = `120px repeat(${k}, 1fr)`;
  header.appendChild(matrixCell("", "label"));
  for (const n of names) header.appendChild(matrixCell(n, "label"));
  matrix.appendChild(header);

  // Body rows
  for (let i = 0; i < k; i++) {
    const row = document.createElement("div");
    row.className = "matrix-row";
    row.style.gridTemplateColumns = `120px repeat(${k}, 1fr)`;
    row.appendChild(matrixCell(names[i], "label"));
    for (let j = 0; j < k; j++) {
      if (i === j) { row.appendChild(matrixCell("·", "diag")); continue; }
      const p = lookup[names[i] + "|" + names[j]] || lookup[names[j] + "|" + names[i]];
      if (!p) { row.appendChild(matrixCell("—", "")); continue; }
      let cls = "tie", txt = "tie";
      if (p.winner === names[i])      { cls = "win";  txt = "win"; }
      else if (p.winner === names[j]) { cls = "loss"; txt = "loss"; }
      else                             { cls = "tie";  txt = "tie"; }
      const cell = matrixCell(txt, cls);
      cell.title = `${names[i]} vs ${names[j]} · t-p=${p.t_p_value}, w-p=${p.w_p_value}`;
      row.appendChild(cell);
    }
    matrix.appendChild(row);
  }
}

function matrixCell(text, cls) {
  const c = document.createElement("div");
  c.className = "matrix-cell" + (cls ? " " + cls : "");
  c.textContent = text;
  return c;
}

function renderMeta(d) {
  document.getElementById("metaBar").hidden = false;
  document.getElementById("metaSuite").textContent  = d.suite;
  document.getElementById("metaModels").textContent = d.n_models;
  document.getElementById("metaPairs").textContent  = d.n_pairs;
  document.getElementById("metaAlpha").textContent  = d.alpha_bonferroni.toFixed(4);
  document.getElementById("metaTiming").textContent = `${d.timing_ms.toFixed(0)} ms`;
}

async function loadSuite(suite) {
  const col = document.getElementById("modelColumn");
  col.innerHTML = `<div class="loading-shell"><div class="spinner"></div><span>Generating storm…</span></div>`;
  document.getElementById("matrixSection").hidden = true;
  document.getElementById("metaBar").hidden = true;
  try {
    const d = await api("POST", "/api/leaderboard", { suite, size: 18, seed: 42 });
    renderEntries(d.entries);
    renderMatrix(d.entries, d.pairs);
    renderMeta(d);
  } catch (e) {
    col.innerHTML = `<div class="loading-shell" style="color:var(--fail)">${e.message}</div>`;
  }
}

// Tab switching
document.querySelectorAll(".suite-tab").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".suite-tab").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    loadSuite(btn.dataset.suite);
  });
});

loadSuite("adversarial");
</script>
